<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#102c36"><title>Monster Islands · First Release</title><script src="https://telegram.org/js/telegram-web-app.js"></script><link rel="stylesheet" href="/static/style.css"></head>
<body>
<div id="game" class="game">
 <div class="world" id="world" aria-label="Остров. Кликните на землю для движения персонажа"><div class="map" id="map"></div><div class="placed" id="placed"></div><div class="character" id="character"><div class="character-shadow"></div><div class="character-art">🧑🏻‍🌾</div></div><div class="pets" id="pets"></div><div id="tapMarker" class="tap-marker"></div></div>
 <header class="hud"><div class="player-card"><div class="avatar">🧑🏻‍🌾</div><div><strong id="playerName">Искатель</strong><div class="progress-row"><span>Ур. 1</span><div class="exp-bar"><i></i></div></div></div></div><div class="currency"><span>🪙 <b id="coins">—</b></span><span>💎 <b id="crystals">—</b></span></div></header>
 <aside class="side-nav"><button data-tab="Кейсы">📦<small>Кейсы</small></button><button data-tab="Монстры">🐲<small>Монстры</small></button><button data-tab="Инвентарь">🎒<small>Рюкзак</small></button><button data-tab="Рынок">🏪<small>Рынок</small></button><button data-tab="Задания">📜<small>Задания</small></button></aside>
 <div class="bottom-actions"><button class="pixel-button" id="menuButton">☰ <span>Меню</span></button><div class="info-pill">🏝️ Изумрудный остров</div><button class="pixel-button build" id="buildButton">🔨 <span>Построить</span></button></div>
 <div id="joystick" class="joystick"><div id="knob" class="knob"></div></div>
 <div class="build-picker" id="buildPicker"><h3>🔨 Строительство</h3><p>Выбери объект, затем нажми на остров</p><div class="build-choices"><button data-kind="tree">🌳 Дерево <small>Бесплатно</small></button><button data-kind="garden">🌻 Сад <small>120 🪙</small></button><button data-kind="lantern">🏮 Фонарь <small>60 🪙</small></button></div><button id="cancelBuild">Закрыть</button></div>
 <div class="scrim" id="scrim"></div><section class="panel" id="panel" role="dialog" aria-modal="true" aria-label="Игровое меню"><header><h2 id="panelTitle">Меню</h2><button id="closePanel">✕</button></header><div id="panelBody"></div></section>
 <div class="toast" id="toast" role="status"></div>
</div><script src="/static/game.js"></script></body></html>
